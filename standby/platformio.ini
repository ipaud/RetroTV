; RETROTV standby app (docs/WAKEWORD.md): only STANDBY VOZ, with the "Hola ESP" wake word and the claps.
; ESP-IDF 5.4.1 (ESP-SR 2.5.5 needs >= 5.0); the TV firmware next door stays on Arduino 2.0.17.
; It runs from the TV's ota_1 partition: tools/standby_flash.sh builds the model and flashes both.
[env:standby]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; The microWakeWord model, embedded (src/CMakeLists.txt EMBED_FILES; PlatformIO needs it here too)
board_build.embed_files = models/heyretro.tflite
; Missing model: an empty one in its place, no «Hey Retro»
extra_scripts = pre:model_placeholder.py
monitor_speed = 115200
build_flags = -std=gnu++17
; esp-dl (pulled in by esp-sr) uses cmake_language(DEFER), CMake >= 3.19; the platform ships 3.16.4.
platform_packages = platformio/tool-cmake@3.30.2
