; RETROTV — firmware for the Freenove ESP32-S3 Display 2.8" (FNK0104A / FNK0104B).
; Build: platformio run · Flash: platformio run --target upload · Logs: platformio device monitor
;
; Platform pinned to espressif32@6.9.0 = Arduino core 2.0.17 (ESP-IDF 4.4, legacy I2S/I2C drivers),
; the combination already proven on this board. Why each library is here: README.md.

[platformio]
default_envs = pautv

[env:pautv]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 8 MB octal PSRAM in the package + 16 MB QSPI flash (schematic, docs/HARDWARE.md).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; USB-C goes straight to the S3 native USB (GPIO19/20), there is no USB-UART bridge.
; C++17 like the host tests (aggregates with default member initialisers, inline variables).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Strict warnings for our own code only; library warnings are not ours to fix.
build_src_flags =
    -Wall
    -Wextra

lib_deps =
    moononournation/GFX Library for Arduino@1.6.0
    bblanchon/ArduinoJson@7.4.3
    bitbank2/JPEGDEC@1.8.4
    https://github.com/pschatzmann/arduino-libhelix.git#v0.8.1
